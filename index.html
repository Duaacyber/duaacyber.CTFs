---
layout: default
title: Home
---

<h2>> Recent Writeups</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%b %d, %Y" }}</span>
      <br>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <br>
      <small>{{ post.summary }}</small>
    </li>
  {% endfor %}
</ul>
